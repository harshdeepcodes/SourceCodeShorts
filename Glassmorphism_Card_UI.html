<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Profile Card</title>
  <style>
    /* styles.css */

/* ---------- Root Variables ---------- */
:root {
  --bg-gradient: linear-gradient(135deg, #c3d9ff, #f5d0fe);
  --card-bg: rgba(255, 255, 255, 0.15);
  --text-color: #000000;
  --accent: #3b82f6;
  --blur: 20px;
  --radius: 16px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  --transition: 0.3s ease;
}

/* ---------- Base Layout ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-gradient);
  color: var(--text-color);
}

/* ---------- Glass Card ---------- */
.container {
  width: 90%;
  max-width: 420px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 2rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ---------- Profile Content ---------- */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.5);
  margin: 0 auto;
}

.name {
  font-size: 1.5rem;
  font-weight: 600;
}

.bio {
  font-size: 0.95rem;
  opacity: 0.85;
}

/* ---------- Buttons ---------- */
.buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
  margin-top: 0.5rem;
}

button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0.7rem 1.2rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1rem;
  transition: background var(--transition), transform var(--transition);
}

button.secondary {
  background: #3b82f6;
}

button:hover,
button:focus {
  background: #2563eb;
  outline: none;
  transform: translateY(-2px);
}

/* ---------- Responsive ---------- */
@media (min-width: 480px) {
  .card {
    padding: 2.5rem;
  }
}

  </style>
</head>
<body>
  <!-- Centered Glass Card -->
  <main class="container">
    <section class="card" aria-label="Profile Card">
      <img src="pfp.img" alt="Profile photo placeholder" class="profile-img">
      <h1 class="name">HarshdeepCodes</h1>
      <p class="bio">Frontend Developer • UI Enthusiast • Coffee Lover</p>
      <div class="buttons">
        <button type="button">Follow</button>
        <button type="button" class="secondary">Message</button>
      </div>
    </section>
  </main>
</body>
</html>
