<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Search Expansion</title>
  <style>
    /* styles.css */

/* ---------- CSS Variables (easy theme edits) ---------- */
:root{
  --bg: #eef6fb;
  --card: #ffffff;
  --accent: #2563eb;
  --muted: #6b7280;
  --radius: 999px;
  --shadow: 0 10px 30px rgba(16,24,40,0.08);
  --trans: 360ms cubic-bezier(.2,.9,.2,1);
  --icon-size: 20px;
}

/* ---------- Page layout ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg,var(--bg) 0%, #fdf6ff 100%);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:24px;
}

/* ---------- Search wrapper ---------- */
/* Mobile-first: tiny circle showing only icon */
.search-wrapper{
  width:52px;
  height:52px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px;
  transition: width var(--trans), box-shadow var(--trans), background var(--trans);
  overflow:hidden;
  position:relative;
}

/* Expanded state (max width caps to 320px) */
.search-wrapper.active{
  width:320px;
  max-width:90vw;
  padding:6px 12px;
}

/* ---------- Icon buttons ---------- */
.icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:var(--icon-size);
  transition: transform var(--trans);
  color:var(--accent);
  flex-shrink:0;
}

.icon:focus{
  outline:3px solid rgba(37,99,235,0.18);
  outline-offset:2px;
}

.icon:hover{ transform:scale(1.06) }

/* search icon hides when active (fade + no pointer events) */
.search-wrapper.active .search-icon{
  opacity:0;
  transform:scale(.8);
  pointer-events:none;
}

/* close icon hidden by default, shown when active */
.close-icon{
  opacity:0;
  transform:scale(.8);
  pointer-events:none;
}
.search-wrapper.active .close-icon{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

/* ---------- Input styling with smooth width/opacity transitions ---------- */
#search-input{
  border:0;
  outline:0;
  background:transparent;
  font-size:1rem;
  color:#111827;
  width:0;
  opacity:0;
  transition: width var(--trans), opacity var(--trans), padding var(--trans);
  padding:0;
}

/* Remove browser built-in clear/cancel icon for search inputs
   (prevents the extra '×' that some browsers show inside type=search) */
#search-input::-webkit-search-decoration,
#search-input::-webkit-search-cancel-button,
#search-input::-webkit-search-results-button,
#search-input::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
  display: none;
}

#search-input::-ms-clear,
#search-input::-ms-reveal {
  display: none;
  width: 0;
  height: 0;
}

/* When expanded, input grows to fill available space (taking icons into account) */
.search-wrapper.active #search-input{
  width:calc(100% - 104px); /* subtract icon widths + gaps */
  opacity:1;
  padding:8px 6px;
}

/* Placeholder styling */
#search-input::placeholder{
  color:var(--muted);
  opacity:0.9;
}

/* Focused input emphasis */
#search-input:focus{
  box-shadow: none;
}

/* ---------- Small visual polish ---------- */
.search-wrapper{
  border: 1px solid rgba(15, 23, 42, 0.06);
}
.search-wrapper.active{
  box-shadow:0 14px 40px rgba(16,24,40,0.12);
}

/* ---------- Responsive behavior ---------- */
@media (min-width:480px){
  :root{ --icon-size:22px }
  .search-wrapper{ width:56px; height:56px }
  .search-wrapper.active{ max-width:320px }
}

/* ---------- Accessibility: high contrast focus fallback ---------- */
@media (prefers-contrast: more){
  .icon:focus{ outline:3px solid #000; outline-offset:2px }
}

  </style>
</head>
<body>
  <div class="search-wrapper" aria-hidden="false">
    <button class="icon search-icon" id="open-btn" aria-label="Open search" title="Search">🔍</button>
    <input type="search" id="search-input" placeholder="Search..." aria-label="Search input" />
    <button class="icon close-icon" id="close-btn" aria-label="Close search" title="Close">✖</button>
  </div>

 
  <script>
    const wrapper = document.querySelector('.search-wrapper');
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const input = document.getElementById('search-input');

    openBtn.addEventListener('click', () => {
      wrapper.classList.add('active');
      input.focus();
    });

    closeBtn.addEventListener('click', () => {
      wrapper.classList.remove('active');
      input.value = '';
      openBtn.focus();
    });

    // collapse when Escape is pressed inside input
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        wrapper.classList.remove('active');
        input.value = '';
        openBtn.focus();
      }
    });
  </script>
</body>
</html>
