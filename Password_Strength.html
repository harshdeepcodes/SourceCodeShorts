<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Meter</title>
  <style>
    /* styles.css */

/* ---------- Root Variables ---------- */
:root {
  --bg-gradient: linear-gradient(135deg, #dceefb, #f3e8ff);
  --card-bg: #fff;
  --text-color: #333;
  --accent: #3b82f6;
  --border-color: #ccc;
  --radius: 10px;
  --shadow: 0 8px 20px rgba(0,0,0,0.1);
  --transition: 0.3s ease;
}

/* ---------- Base Layout ---------- */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-gradient);
}

/* ---------- Card ---------- */
.container {
  width: 90%;
  max-width: 420px;
}

.password-form {
  background: var(--card-bg);
  padding: 2rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.password-form h1 {
  text-align: center;
  color: var(--text-color);
}

/* ---------- Input Field ---------- */
.input-group label {
  display: block;
  margin-bottom: 0.5rem;
  color: #555;
  font-weight: 500;
}

.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.password-wrapper input {
  width: 100%;
  padding: 0.9rem 2.5rem 0.9rem 0.9rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  font-size: 1rem;
  transition: border var(--transition);
}

.password-wrapper input:focus {
  border-color: var(--accent);
  outline: none;
}

.password-wrapper button {
  position: absolute;
  right: 0.6rem;
  background: transparent;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  transition: transform var(--transition);
}

.password-wrapper button:hover {
  transform: scale(1.2);
}

/* ---------- Meter ---------- */
.meter {
  width: 100%;
  height: 10px;
  background: #eee;
  border-radius: var(--radius);
  overflow: hidden;
}

#strength-bar {
  width: 0%;
  height: 100%;
  background: #ddd;
  transition: width var(--transition), background var(--transition);
  border-radius: var(--radius);
}

#strength-text {
  font-size: 0.9rem;
  color: #555;
  text-align: center;
}

/* ---------- Responsive ---------- */
@media (min-width: 480px) {
  .password-form {
    padding: 2.5rem;
  }
}

  </style>
</head>
<body>
  <!-- Centered Card -->
  <main class="container">
    <form class="password-form" aria-label="Password Strength Form">
      <h1>Create Account</h1>

      <!-- Password Field -->
      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password" required aria-describedby="strength-text">
          <button type="button" id="toggle-password" aria-label="Show or hide password">👁️</button>
        </div>
      </div>

      <!-- Strength Meter -->
      <div class="meter">
        <div id="strength-bar"></div>
      </div>
      <p id="strength-text" aria-live="polite">Strength: —</p>
    </form>
  </main>

  <!-- Inline JavaScript for strength logic -->
  <script>
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');
    const toggleBtn = document.getElementById('toggle-password');

    // Evaluate password strength
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[a-z]/.test(val)) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      // Set bar and text based on score
      const levels = ["Very Weak", "Weak", "Medium", "Strong", "Very Strong"];
      const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#16a34a"];
      const width = (score / 5) * 100;

      strengthBar.style.width = width + "%";
      strengthBar.style.background = colors[score - 1] || "#ddd";
      strengthText.textContent = val ? `Strength: ${levels[score - 1] || "Very Weak"}` : "Strength: —";
    });

    // Toggle show/hide password
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });
  </script>
</body>
</html>
