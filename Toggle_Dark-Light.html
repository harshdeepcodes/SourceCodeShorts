<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Dark/Light Mode Glassmorphism</title>
    <STYLE>
        /* styles.css */

        /* ---------- Root Variables ---------- */
        :root {
            --light-bg: linear-gradient(135deg, #c3d9ff, #f5d0fe);
            --dark-bg: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg-light: rgba(255, 255, 255, 0.25);
            --card-bg-dark: rgba(0, 0, 0, 0.25);
            --text-light: #fff;
            --text-dark: #222;
            --accent: #3b82f6;
            --blur: 20px;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            --transition: 0.6s ease;
        }

        /* ---------- Base Layout ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            transition: background var(--transition), color var(--transition), backdrop-filter var(--transition);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--light-bg);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* Dark mode overrides */
        body.dark {
            background: var(--dark-bg);
            color: var(--text-light);
        }

        /* ---------- Toggle Switch ---------- */
        .toggle-container {
            position: absolute;
            top: 8rem;
            right: 50;
        }

        .toggle-label {
            width: 70px;
            height: 35px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            position: relative;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .toggle-label .ball {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 27px;
            height: 27px;
            background: #fff;
            border-radius: 50%;
            transition: all var(--transition);
        }

        #theme-toggle {
            display: none;
        }

        #theme-toggle:checked+.toggle-label .ball {
            transform: translateX(35px);
            background: #0f172a;
        }

        /* ---------- Card ---------- */
        .container {
            width: 90%;
            max-width: 420px;
            transition: var(--transition);
        }

        .card {
            background: var(--card-bg-light);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: floatIn 1.2s ease forwards;
        }

        body.dark .card {
            background: var(--card-bg-dark);
        }

        /* ---------- Profile Content ---------- */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.6);
            margin: 0 auto;
            animation: pop 1s ease forwards;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 600;
        }

        .bio {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        /* ---------- Buttons ---------- */
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1rem;
            transition: background var(--transition), transform var(--transition);
        }

        button.secondary {
            background: #3b82f6;
        }

        button:hover,
        button:focus {
            transform: translateY(-2px);
            outline: none;
            background: #2563eb;
        }

        /* ---------- Animations ---------- */
        @keyframes floatIn {
            0% {
                transform: translateY(40px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ---------- Responsive ---------- */
        @media (min-width: 480px) {
            .card {
                padding: 2.5rem;
            }
        }
    </STYLE>
</head>

<body>
    <header class="toggle-container">
        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark and light mode">
        <label for="theme-toggle" class="toggle-label">
            <span class="sun">☀️</span>
            <span class="moon">🌙</span>
            <div class="ball"></div>
        </label>
    </header>
    <main class="container">
        <section class="card" aria-label="Profile Card">
            <img src="img.png" alt="Profile photo placeholder" class="profile-img">
            <h1 class="name">Harshdeep Codes</h1>
            <p class="bio">Frontend Developer • UI Enthusiast • Coffee Lover</p>
            <div class="buttons">
                <button type="button">Follow</button>
                <button type="button" class="secondary">Message</button>
            </div>
        </section>
    </main>

    <script>
        // Theme toggle logic with smooth transition
        const toggle = document.getElementById('theme-toggle');
        toggle.addEventListener('change', () => {
            document.body.classList.toggle('dark', toggle.checked);
        });
    </script>
</body>

</html>
